name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# Plugin images are built by the "Build Plugin Images" workflow
# (.github/workflows/plugins.yaml), tagged with each plugin's own version.
# This workflow builds the plugger CLI release artifacts only, via GoReleaser
# (.goreleaser.yaml): raw binaries, SHA256SUMS, .deb/.rpm and the Homebrew
# formula. Pushes to main run a snapshot (nothing published); tags release.

jobs:
  cli:
    name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Release' || 'Snapshot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Decide GoReleaser arguments
        id: args
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "args=release --snapshot --clean" >> "$GITHUB_OUTPUT"
          elif [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; releasing without updating the Homebrew tap"
            echo "args=release --clean --skip=homebrew" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          fi

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: plugger-snapshot
          path: |
            dist/plugger-*
            dist/SHA256SUMS
          if-no-files-found: error
