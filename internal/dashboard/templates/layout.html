<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Plugger Dashboard{{end}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1e1e2e', 900: '#11111b', 700: '#313244' }
                    }
                }
            }
        }
        // Theme: auto (system) / dark / light — saved in localStorage
        ;(function() {
            var saved = localStorage.getItem('plugger-theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || saved === null) {
                document.documentElement.classList.add('dark');
            }
            if (saved === 'light') {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <style>
        .log-container { max-height: 500px; }
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-track { background: var(--scroll-track); }
        .log-container::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
        :root { --scroll-track: #f3f4f6; --scroll-thumb: #d1d5db; }
        .dark { --scroll-track: #1e1e2e; --scroll-thumb: #585b70; }

        /* Light mode overrides */
        html:not(.dark) body { background: #f9fafb; color: #1f2937; }
        html:not(.dark) nav { background: #ffffff; border-color: #e5e7eb; }
        html:not(.dark) nav a { color: #374151; }
        html:not(.dark) nav a:hover { color: #111827; }
        html:not(.dark) .bg-dark-800 { background: #ffffff; border-color: #e5e7eb; }
        html:not(.dark) .bg-dark-900 { background: #f9fafb; }
        html:not(.dark) .bg-dark-700 { background: #f3f4f6; }
        html:not(.dark) .bg-dark-700\/50, html:not(.dark) .bg-dark-700\/30, html:not(.dark) .bg-dark-700\/20 { background: #f3f4f680; }
        html:not(.dark) .border-gray-700 { border-color: #e5e7eb; }
        html:not(.dark) .border-gray-700\/50, html:not(.dark) .border-gray-700\/30 { border-color: #e5e7eb80; }
        html:not(.dark) .text-gray-200 { color: #1f2937; }
        html:not(.dark) .text-gray-300 { color: #374151; }
        html:not(.dark) .text-gray-400 { color: #6b7280; }
        html:not(.dark) .text-gray-500 { color: #9ca3af; }
        html:not(.dark) .text-gray-600 { color: #d1d5db; }
        html:not(.dark) .text-white { color: #111827; }
        html:not(.dark) code { background: #e5e7eb; color: #374151; }

        /* Badges and status text. The dark palette pairs a *-400 text with a
           translucent *-900 background; on white cards that is pastel-on-pastel.
           Remap to the classic light "tint + 700 text" pairing so every badge,
           link and status word stays readable without touching each template. */
        html:not(.dark) .text-green-400  { color: #15803d; }
        html:not(.dark) .text-red-400    { color: #b91c1c; }
        html:not(.dark) .text-yellow-400 { color: #a16207; }
        html:not(.dark) .text-orange-400 { color: #c2410c; }
        html:not(.dark) .text-blue-400   { color: #1d4ed8; }
        html:not(.dark) .text-blue-300   { color: #1e40af; }
        html:not(.dark) .text-blue-500   { color: #2563eb; }
        html:not(.dark) .text-purple-400 { color: #7e22ce; }
        html:not(.dark) .text-purple-300 { color: #6b21a8; }
        html:not(.dark) .bg-green-900\/50,  html:not(.dark) .bg-green-900\/30  { background: #dcfce7; }
        html:not(.dark) .bg-red-900\/50,    html:not(.dark) .bg-red-900\/30,
        html:not(.dark) .bg-red-900\/20                                        { background: #fee2e2; }
        html:not(.dark) .bg-yellow-900\/50, html:not(.dark) .bg-yellow-900\/30 { background: #fef9c3; }
        html:not(.dark) .bg-orange-900\/50                                     { background: #ffedd5; }
        html:not(.dark) .bg-blue-900\/50,   html:not(.dark) .bg-blue-900\/30   { background: #dbeafe; }
        html:not(.dark) .bg-purple-900\/30                                     { background: #f3e8ff; }
        html:not(.dark) .bg-gray-900\/30,   html:not(.dark) .bg-gray-700\/50,
        html:not(.dark) .bg-gray-600\/40                                       { background: #e5e7eb; }
        html:not(.dark) .border-green-800\/50 { border-color: #86efac; }
        html:not(.dark) .border-red-800\/50   { border-color: #fca5a5; }
        /* Action buttons (start/stop/restart/uninstall) keep a saturated/dark
           background in light mode, so their label must stay white — the
           blanket .text-white remap above would otherwise make them
           dark-on-dark and unreadable. Restore white on exactly those
           backgrounds, including the muted uninstall button. */
        html:not(.dark) .bg-green-600,
        html:not(.dark) .bg-red-600,
        html:not(.dark) .bg-red-600\/80,
        html:not(.dark) .bg-gray-600,
        html:not(.dark) .bg-gray-700 { color: #ffffff; }

        /* Theme toggle button */
        .theme-btn { transition: all 0.2s; }
        .theme-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body class="bg-dark-900 text-gray-200 min-h-screen">
    <nav class="bg-dark-800 border-b border-gray-700 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 text-white hover:text-blue-400 transition-colors">
                <img src="/logo.svg" alt="Plugger" class="w-8 h-8">
                <span class="text-xl font-bold">Plugger</span>
            </a>
            <div class="flex items-center gap-4 text-sm text-gray-400">
                <a href="/" class="hover:text-white transition-colors">Dashboard</a>
                <a href="/metrics" class="hover:text-white transition-colors">Metrics</a>
                <a href="/config" class="hover:text-white transition-colors">Config</a>
                <a href="/reports" class="hover:text-white transition-colors">Reports</a>
                <a href="/registry" class="hover:text-white transition-colors">Registry</a>
                <!-- Theme toggle -->
                <div class="flex items-center gap-1 ml-2">
                    <button onclick="setTheme('light')" class="theme-btn p-1 rounded hover:bg-dark-700" title="Light mode">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </button>
                    <button onclick="setTheme('auto')" class="theme-btn p-1 rounded hover:bg-dark-700" title="System default">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    </button>
                    <button onclick="setTheme('dark')" class="theme-btn p-1 rounded hover:bg-dark-700" title="Dark mode">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-6 py-8">
        {{block "content" .}}{{end}}
    </main>
    <script>
    function setTheme(mode) {
        localStorage.setItem('plugger-theme', mode);
        if (mode === 'dark') {
            document.documentElement.classList.add('dark');
        } else if (mode === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            // auto — follow system
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
    }
    // Listen for system theme changes when in auto mode
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (localStorage.getItem('plugger-theme') === 'auto' || !localStorage.getItem('plugger-theme')) {
            setTheme('auto');
        }
    });
    </script>
</body>
</html>
{{/* access_badge renders the PCE access level badge for a plugin. Argument: "readonly" | "readwrite". */}}
{{define "access_badge"}}{{if eq . "readwrite"}}<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wide bg-orange-900/50 text-orange-400" title="Writes to the PCE: labels, workloads or policy">read-write</span>{{else}}<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wide bg-green-900/50 text-green-400" title="Only reads from the PCE">read-only</span>{{end}}{{end}}
